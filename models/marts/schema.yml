version: 2
models:
  - name: dim_customer
    description: >
      Customer dimension containing cleaned customer attributes
      used for analytical reporting.
    columns:
      - name: customer_key
        description: "Warehouse surrogate key"
        tests:
          - unique
              # config
              #   severity: warn
          - not_null
      - name: customer_id
        description: "Business key from source customer system"
        tests:
          - unique
          - not_null
      - name: customer_segment
        description: "Customer classification"
  - name: dim_product
    description: >
      Product dimension containing product attributes
      used for sales and profitability analysis.
    columns:
      - name: product_key
        description: "Warehouse surrogate key"
        tests:
          - unique
          - not_null
      - name: product_id
        description: "Source product identifier"
        tests:
          - unique
          - not_null
      - name: category
        description: "Product category"

  - name: dim_store
    description: >
      Store dimension containing store attributes
      used for sales and operational reporting.
    columns:
      - name: store_key
        description: "Warehouse surrogate key"
        tests:
          - unique
          - not_null
      - name: store_id
        description: "Source store identifier"
        tests:
          - unique
          - not_null
      - name: region
        description: "Geographical sales region"